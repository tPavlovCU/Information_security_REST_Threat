services:
  postgres:
    image: postgres:17
    container_name: threat-intelligence-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: threat_user
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: threats_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: